name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test NRI plugin
        run: make test-go

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install hwloc
        run: sudo apt-get update && sudo apt-get install -y hwloc
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/converged-computing/fluxbind.git@test-cpuset"
          python -m pip install . pytest
      - name: Test DRA driver
        run: make test-python
